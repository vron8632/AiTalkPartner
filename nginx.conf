# ============================================================
# 言值AI - Nginx 配置模板（宝塔）
# 使用方法：
#   1. 宝塔 → 网站 → 添加站点（填你的域名）→ 提交
#   2. 站点设置 → SSL → 申请 Let's Encrypt 证书
#   3. 站点设置 → 配置文件 → 用本文件内容【全部替换】
#   4. 把 your-domain.com 替换成你的真实域名
#   5. 重载 Nginx（宝塔面板「重启」或 nginx -s reload）
# ============================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # 宝塔申请证书后的默认路径（自动生成，无需改动）
    ssl_certificate    /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;

    # 录音上传文件较大，必须调大（默认 1m 会导致上传失败）
    client_max_body_size 50m;

    # ---- 后端统一服务：React 前台页面 + /api 接口 + /admin 后台 ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;   # AI 评价耗时较长，防止 502
    }

    # ---- 静态文件 / 用户上传文件（Nginx 直出，更快）----
    location /static/ { alias /www/wwwroot/yanzhi/backend/staticfiles/; }
    location /media/  { alias /www/wwwroot/yanzhi/backend/media/; }
}
